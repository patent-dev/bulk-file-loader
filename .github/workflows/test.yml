name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
          - db: mysql
            dsn: 'root:test@tcp(127.0.0.1:3306)/'
          - db: postgres
            dsn: 'postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable'
    name: test (${{ matrix.db }})
    services:
      # An empty image skips the service, so each leg starts only its database.
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -ptest"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: ${{ matrix.db == 'postgres' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.2

      - name: Generate API code
        run: |
          oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          mkdir -p api/client
          oapi-codegen -config api/oapi-client.yaml api/openapi.yaml

      - name: Build frontend
        run: |
          cd web/ui
          npm ci
          npm run build

      - name: Run tests
        env:
          BULK_LOADER_TEST_DB_DRIVER: ${{ matrix.db }}
          BULK_LOADER_TEST_DB_DSN: ${{ matrix.dsn }}
        run: go test -v ./...

      - name: Run go vet
        run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: web/ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web/ui

      - name: Run lint
        run: npm run lint
        working-directory: web/ui

      - name: Build
        run: npm run build
        working-directory: web/ui
